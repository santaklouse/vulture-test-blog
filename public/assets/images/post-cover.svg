<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Vulture Blog article cover</title>
  <desc id="description">Abstract blue and violet shapes surrounding a code window.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#background)"/>
  <circle cx="1060" cy="100" r="260" fill="#7c3aed" opacity=".2"/>
  <circle cx="120" cy="650" r="300" fill="#0891b2" opacity=".18"/>
  <rect x="180" y="130" width="840" height="460" rx="28" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <circle cx="225" cy="175" r="10" fill="#fb7185"/>
  <circle cx="260" cy="175" r="10" fill="#fbbf24"/>
  <circle cx="295" cy="175" r="10" fill="#4ade80"/>
  <path d="M300 300 230 360l70 60M900 300l70 60-70 60" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m690 255-150 210" fill="none" stroke="#e2e8f0" stroke-width="22" stroke-linecap="round"/>
  <text x="600" y="550" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="8">VULTURE BLOG</text>
</svg>
